name: Collect Idaho public projects and publish

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/opportunities.json'
      - 'public/data/**'
      - 'public/feeds/**'
  schedule:
    - cron: '27 */6 * * *'

permissions:
  contents: read

concurrency:
  group: public-project-intelligence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    permissions:
      contents: write
    outputs:
      artifact-id: ${{ steps.pages_artifact.outputs.artifact_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt

      - name: Test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Collect and render
        env:
          PYTHONPATH: src
        run: python -m idaho_public_projects.main

      - name: Collection health
        shell: python
        run: |
          import json
          from pathlib import Path
          sources = json.loads(Path('public/data/sources.json').read_text())['collector_status']
          total = sum(s['records_seen'] for s in sources)
          healthy = sum(1 for s in sources if s['records_seen'] > 0)
          print('Total parsed records:', total)
          for s in sources:
              print(f"{s['source']}: {s['status']} ({s['records_seen']}) {s['note']}")
          if total == 0 or healthy < 2:
              raise SystemExit('Collection health check failed: fewer than two public sources produced records.')

      - name: Collection results
        shell: python
        run: |
          import json, os
          from pathlib import Path
          p=json.loads(Path('public/data/opportunities.json').read_text())
          s=json.loads(Path('public/data/sources.json').read_text())
          rows=p.get('opportunities',[])
          site=f"https://{os.environ['GITHUB_REPOSITORY_OWNER']}.github.io/{os.environ['GITHUB_REPOSITORY'].split('/',1)[1]}/"
          lines=['# Idaho Public Project Intelligence — Collection Results','',
                 f"**Generated:** {p.get('generated_at','')}",'',
                 f"**Tracked opportunities:** {len(rows):,}",'',
                 f"## [Open dashboard]({site})",'',
                 '## Collector results','',
                 '| Source | Status | Records | Note |','|---|---|---:|---|']
          for x in s['collector_status']:
              note=str(x.get('note','')).replace('|','\\|').replace('\n',' ')
              lines.append(f"| {x['source']} | {x['status']} | {x['records_seen']} | {note} |")
          lines += ['', '## Top opportunities', '', '| Score | Due | Agency | Stage | Project |', '|---:|---|---|---|---|']
          for r in sorted(rows,key=lambda x:(x.get('score',0),x.get('due_date','')),reverse=True)[:15]:
              title=str(r.get('title','')).replace('|','\\|')
              lines.append(f"| {r.get('score',0)} | {r.get('due_date','')} | {r.get('agency','')} | {r.get('stage','')} | {title} |")
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines)+'\n')

      - name: Persist history and generated feeds
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/opportunities.json public/data public/feeds
          git diff --cached --quiet || git commit -m "Update Idaho public project intelligence"
          git push

      - name: Upload Pages artifact
        id: pages_artifact
        if: github.event.repository.private == false
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  verify-pages-artifact:
    needs: collect
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Verify the exact upload ID is present
        env:
          UPLOADED_ID: ${{ needs.collect.outputs.artifact-id }}
        shell: bash
        run: |
          [[ "$UPLOADED_ID" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Pages upload produced no valid artifact ID"; exit 1; }

      # No token, repository or run-id input: query the runner's current-run
      # artifact service, as deploy-pages does, not the REST artifact listing.
      - name: Check runner artifact service
        id: probe
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          # A PR deliberately tests the miss path using an impossible ID.
          artifact-ids: ${{ github.event_name == 'pull_request' && '0' || needs.collect.outputs.artifact-id }}
          path: ${{ runner.temp }}/pages-probe-1

      - name: Wait before second look
        if: steps.probe.outcome == 'failure'
        run: sleep 5

      - name: Retry the exact upload ID
        id: retry
        if: steps.probe.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact-id }}
          path: ${{ runner.temp }}/pages-probe-2

      - name: Wait before final look
        if: steps.retry.outcome == 'failure'
        run: sleep 15

      - name: Final probe for the exact upload ID
        id: final_probe
        if: steps.retry.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact-id }}
          path: ${{ runner.temp }}/pages-probe-3

      - name: Check the Pages archive contents without publishing
        env:
          FIRST: ${{ steps.probe.outcome }}
          SECOND: ${{ steps.retry.outcome }}
          THIRD: ${{ steps.final_probe.outcome }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [[ "$EVENT" == 'pull_request' && "$FIRST" != 'failure' ]]; then
            echo '::error::The PR test did not exercise the expected first miss'; exit 1
          fi
          if [[ "$FIRST" == 'success' ]]; then index=1
          elif [[ "$SECOND" == 'success' ]]; then index=2
          elif [[ "$THIRD" == 'success' ]]; then index=3
          else echo '::error::No artifact probe succeeded'; exit 1
          fi
          archive="$RUNNER_TEMP/pages-probe-$index/github-pages/artifact.tar"
          names="$RUNNER_TEMP/pages-probe-files.txt"
          tar -tf "$archive" > "$names"
          grep -Fx './index.html' "$names"
          grep -Fx './data/opportunities.json' "$names"
          grep -Fx './data/sources.json' "$names"
          echo "Verified exact Pages artifact on attempt $index. No publication performed."

  publish:
    needs: verify-pages-artifact
    if: github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
